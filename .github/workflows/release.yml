# Builds the Windows installer. A version tag (v1.2.3, pushed here from GitLab)
# publishes it as a GitHub release, which GitLab's release job then copies.
# Started by hand, it only builds, and the installer is kept as a run artifact.
#
# The NetFilter SDK and the drivers are not in the repository: they are a
# release asset of a private repository (BUILD_DEPS_REPO, release
# deps-<BUILD_DEPS_VERSION>, see tools/upload-build-deps.ps1), downloaded with
# the read-only token in the BUILD_DEPS_GITHUB_TOKEN secret and checked against
# the SHA-256 below. (Not from GitLab: Cloudflare's Bot Fight Mode in front of
# git.yanlei.org challenges the runners.)
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_DEPS_VERSION: '6'
  BUILD_DEPS_SHA256: 7af360347d4124b785aa18a9fb3bce711cb87d271adba26776f5947c73a841ac
  BUILD_DEPS_REPO: ChickenSeller/winroute-build-deps

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The tag must match project(... VERSION) in CMakeLists.txt, which names
      # the installer and the version the app shows.
      - name: Check the version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          if ((Get-Content CMakeLists.txt -Raw) -notmatch 'project\(WinRoute VERSION (\d+\.\d+\.\d+)') { throw 'No version in CMakeLists.txt' }
          if ("v$($Matches[1])" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match version $($Matches[1]) in CMakeLists.txt" }

      # Qt with the MinGW it was built with, and Ninja (see the script for why
      # not install-qt-action). Cached: several hundred MB from download.qt.io.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-6.12.0-mingw1310-${{ hashFiles('.github/scripts/install-qt.py') }}

      - name: Install Qt
        shell: pwsh
        run: python .github/scripts/install-qt.py --version 6.12.0 --dir "${{ runner.temp }}/Qt"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Get the NetFilter SDK and the driver
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.BUILD_DEPS_GITHUB_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) { throw 'The BUILD_DEPS_GITHUB_TOKEN secret is not set' }
          gh release download "deps-$env:BUILD_DEPS_VERSION" --repo $env:BUILD_DEPS_REPO `
            --pattern winroute-build-deps.zip --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $zip = Join-Path $env:RUNNER_TEMP 'winroute-build-deps.zip'
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:BUILD_DEPS_SHA256) { throw "winroute-build-deps.zip has SHA-256 $hash, expected $env:BUILD_DEPS_SHA256" }
          Expand-Archive $zip -DestinationPath . -Force
          Remove-Item $zip

      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --parallel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/winroute_tests.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --target installer
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # What the installer must carry: the app, both drivers and their API, Qt
      # and the MinGW runtime.
      - name: Check the installer
        shell: pwsh
        run: |
          $missing = 'WinRoute.exe', 'nfapi.dll', 'WinDivert.dll', 'WinDivert64.sys',
                     'drivers/demo/netfilter2.sys', 'drivers/a/netfilter2.sys', 'drivers/b/netfilter2.sys',
                     'Qt6Core.dll', 'Qt6Widgets.dll', 'Qt6Network.dll', 'libstdc++-6.dll', 'platforms/qwindows.dll' |
            Where-Object { -not (Test-Path "build/stage/$_") }
          if ($missing) { throw "Missing from the installer: $($missing -join ', ')" }
          $setup = Get-Item build/WinRoute-*-setup.exe
          "{0}: {1:N1} MB" -f $setup.Name, ($setup.Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: winroute-windows-x64
          path: build/WinRoute-*-setup.exe

  publish:
    if: github.ref_type == 'tag'
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      # For --verify-tag and the notes from the tag.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --notes-from-tag \
            --title "WinRoute ${GITHUB_REF_NAME#v}"
